<html><head><style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap');
  .nx-wrap{min-height:600px;background:#080c14;border-radius:var(--border-radius-lg);display:flex;align-items:center;justify-content:center;padding:2.5rem 1.5rem;position:relative;overflow:hidden;}
  .nx-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,195,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,195,255,0.04) 1px,transparent 1px);background-size:48px 48px;}
  .nx-glow{position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(0,195,255,0.08) 0%,transparent 70%);top:-80px;right:-60px;pointer-events:none;}
  .nx-glow2{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(90,60,220,0.10) 0%,transparent 70%);bottom:-60px;left:-40px;pointer-events:none;}
  .nx-card{position:relative;background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.10);border-radius:20px;padding:2.25rem 2rem;width:100%;max-width:390px;backdrop-filter:blur(12px);}
  .nx-corner{position:absolute;width:18px;height:18px;border-color:rgba(0,195,255,0.5);border-style:solid;}
  .nx-corner-tl{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:6px 0 0 0;}
  .nx-corner-br{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 6px 0;}
  .nx-logo{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:0.12em;color:#fff;line-height:1;margin-bottom:3px;}
  .nx-logo span{color:#00c3ff;}
  .nx-tag{font-family:'DM Sans',sans-serif;font-size:11px;color:rgba(255,255,255,0.3);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:1.75rem;}
  .nx-label{font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:6px;display:block;}
  .nx-row{display:flex;gap:8px;margin-bottom:1rem;}
  .nx-flag-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.10);border-radius:10px;padding:0 12px;cursor:pointer;min-width:90px;font-family:'DM Sans',sans-serif;font-size:13px;color:rgba(255,255,255,0.75);position:relative;transition:border-color 0.2s;white-space:nowrap;}
  .nx-flag-btn:hover{border-color:rgba(0,195,255,0.4);}
  .nx-flag-emoji{font-size:18px;}
  .nx-chevron{font-size:10px;color:rgba(255,255,255,0.3);margin-left:2px;}
  .nx-dropdown{display:none;position:absolute;top:calc(100% + 6px);left:0;background:#0e1520;border:0.5px solid rgba(255,255,255,0.12);border-radius:10px;z-index:10;width:220px;max-height:200px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.1) transparent;}
  .nx-dropdown.open{display:block;}
  .nx-dd-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;color:rgba(255,255,255,0.65);transition:background 0.15s;}
  .nx-dd-item:hover{background:rgba(0,195,255,0.07);color:#fff;}
  .nx-dd-code{color:rgba(255,255,255,0.35);font-size:12px;margin-left:auto;}
  .nx-input{flex:1;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.10);border-radius:10px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:rgba(255,255,255,0.85);outline:none;transition:border-color 0.2s;box-sizing:border-box;}
  .nx-input::placeholder{color:rgba(255,255,255,0.2);}
  .nx-input:focus{border-color:rgba(0,195,255,0.5);}
  .nx-input-full{width:100%;margin-bottom:1rem;}
  .nx-btn-primary{width:100%;padding:11px 0;background:#00c3ff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:#080c14;cursor:pointer;margin-bottom:1rem;letter-spacing:0.02em;transition:opacity 0.2s,transform 0.15s;}
  .nx-btn-primary:hover{opacity:0.88;transform:translateY(-1px);}
  .nx-btn-primary:active{transform:scale(0.98);}
  .nx-btn-google{width:100%;padding:11px 0;background:transparent;border:0.5px solid rgba(255,255,255,0.18);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:rgba(255,255,255,0.85);cursor:pointer;margin-bottom:1rem;letter-spacing:0.02em;transition:border-color 0.2s,background 0.2s,transform 0.15s;display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;}
  .nx-btn-google:hover{border-color:rgba(255,255,255,0.35);background:rgba(255,255,255,0.05);transform:translateY(-1px);}
  .nx-btn-google:active{transform:scale(0.98);}
  .nx-divider{display:flex;align-items:center;gap:10px;margin-bottom:1rem;}
  .nx-divider-line{flex:1;height:0.5px;background:rgba(255,255,255,0.10);}
  .nx-divider-text{font-family:'DM Sans',sans-serif;font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:0.08em;text-transform:uppercase;}
  .nx-success{display:none;text-align:center;padding:1rem 0;}
  .nx-success.visible{display:block;}
  .nx-success-icon{font-size:40px;margin-bottom:12px;}
  .nx-success-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.1em;color:#00c3ff;margin-bottom:6px;}
  .nx-success-sub{font-family:'DM Sans',sans-serif;font-size:13px;color:rgba(255,255,255,0.4);}
</style>

</head><body><div class="nx-wrap">
  <div class="nx-grid"></div>
  <div class="nx-glow"></div>
  <div class="nx-glow2"></div>
  <div class="nx-card">
    <div class="nx-corner nx-corner-tl"></div>
    <div class="nx-corner nx-corner-br"></div>
    <div class="nx-logo">NEX<span>US</span></div>
    <div class="nx-tag">Lee Electronics shop — Umukiriya ni Umwami </div>
    <div class="nx-tag">Muri NEXUS Electronic shop Ibicuruzwa Tubikugezaho Kubuntu Aho Waba uri Hose</div>

   <div id="step-form">
      <label class="nx-label">Full Name</label>
      <input class="nx-input nx-input-full" type="text" id="inp-name" placeholder="Your full name">

      <label class="nx-label">Mobile Number</label>
      <div class="nx-row" style="position:relative;">
        <button class="nx-flag-btn" id="flag-btn" onclick="toggleDropdown()">
          <span class="nx-flag-emoji" id="flag-emoji">🇷🇼</span>
          <span id="flag-code">+250</span>
          <span class="nx-chevron">▼</span>
          <div class="nx-dropdown" id="country-dropdown">
            <div class="nx-dd-item" onclick="selectCountry('🇷🇼','RW','+250',event)">🇷🇼 Rwanda <span class="nx-dd-code">+250</span></div>
            <div class="nx-dd-item" onclick="selectCountry('🇺🇸','US','+1',event)">🇺🇸 USA <span class="nx-dd-code">+1</span></div>
            <div class="nx-dd-item" onclick="selectCountry('🇬🇧','GB','+44',event)">🇬🇧 UK <span class="nx-dd-code">+44</span></div>
            <div class="nx-dd-item" onclick="selectCountry('🇳🇬','NG','+234',event)">🇳🇬 Nigeria <span class="nx-dd-code">+234</span></div>
            <div class="nx-dd-item" onclick="selectCountry('🇰🇪','KE','+254',event)">🇰🇪 Kenya <span class="nx-dd-code">+254</span></div>
            <div class="nx-dd-item" onclick="selectCountry('🇺🇬','UG','+256',event)">🇺🇬 Uganda <span class="nx-dd-code">+256</span></div>
            <div class="nx-dd-item" onclick="selectCountry('🇹🇿','TZ','+255',event)">🇹🇿 Tanzania <span class="nx-dd-code">+255</span></div>
            <div class="nx-dd-item" onclick="selectCountry('🇿🇦','ZA','+27',event)">🇿🇦 South Africa <span class="nx-dd-code">+27</span></div>
            <div class="nx-dd-item" onclick="selectCountry('🇫🇷','FR','+33',event)">🇫🇷 France <span class="nx-dd-code">+33</span></div>
            <div class="nx-dd-item" onclick="selectCountry('🇮🇳','IN','+91',event)">🇮🇳 India <span class="nx-dd-code">+91</span></div>
            <div class="nx-dd-item" onclick="selectCountry('🇨🇳','CN','+86',event)">🇨🇳 China <span class="nx-dd-code">+86</span></div>
          </div>
        </button>
        <input class="nx-input" type="tel" id="inp-phone" placeholder="780 000 000" style="margin-bottom:0;">
      </div>

      <div style="margin-top:1rem;">
        <button class="nx-btn-primary" onclick="createAccount()">Create Account →</button>
      </div>

      <div class="nx-divider">
        <div class="nx-divider-line"></div>
        <span class="nx-divider-text">or</span>
        <div class="nx-divider-line"></div>
      </div>
      <a href="continue with Google.html"><button class="nx-btn-google" onclick="createAccount()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"></path>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"></path>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"></path>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"></path>
        </svg>
        Continue with Google
      </button></a>
    </div>
    <a href="continue with Google.html"><div class="nx-success" id="step-success">
      <div class="nx-success-icon">✦</div>
      <div class="nx-success-title">Welcome Aboard</div>
      <div class="nx-success-sub" id="success-name-msg">Your NEXUS account is ready.</div>
      <div style="margin-top:1.5rem;">
        <button class="nx-btn-primary" style="margin-bottom:0;">Go to Dashboard →</button>
      </div> </a>

    
    </div>
  </div>
</div>

<script>
function toggleDropdown(){document.getElementById('country-dropdown').classList.toggle('open');}
function selectCountry(flag,code,dialCode,e){e.stopPropagation();document.getElementById('flag-emoji').textContent=flag;document.getElementById('flag-code').textContent=dialCode;document.getElementById('country-dropdown').classList.remove('open');}
document.addEventListener('click',function(e){if(!e.target.closest('#flag-btn'))document.getElementById('country-dropdown').classList.remove('open');});
function createAccount(){
  const phone=document.getElementById('inp-phone').value.trim();
  if(!phone){document.getElementById('inp-phone').focus();return;}
  const name=document.getElementById('inp-name').value.trim()||'User';
  document.getElementById('step-form').style.display='none';
  document.getElementById('step-success').classList.add('visible');
  document.getElementById('success-name-msg').textContent='Your NEXUS account is ready, '+name+'.';
}
</script>
</body></html>
