<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Create Account</title>

<style>

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#080c14;
}

body{
  font-family:'DM Sans',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}

.nx-wrap{
  min-height:600px;
  width:100%;
  background:#080c14;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2.5rem 1.5rem;
  position:relative;
  overflow:hidden;
}

.nx-grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(0,195,255,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,195,255,0.04) 1px,transparent 1px);
  background-size:48px 48px;
}

.nx-glow{
  position:absolute;
  width:360px;
  height:360px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(0,195,255,0.08) 0%,transparent 70%);
  top:-80px;
  right:-60px;
  pointer-events:none;
}

.nx-card{
  position:relative;
  background:rgba(255,255,255,0.03);
  border:0.5px solid rgba(255,255,255,0.10);
  border-radius:20px;
  padding:2.25rem 2rem;
  width:100%;
  max-width:390px;
  backdrop-filter:blur(12px);
}

.nx-corner{
  position:absolute;
  width:18px;
  height:18px;
  border-color:rgba(0,195,255,0.5);
  border-style:solid;
}

.nx-corner-tl{
  top:-1px;
  left:-1px;
  border-width:2px 0 0 2px;
  border-radius:6px 0 0 0;
}

.nx-corner-br{
  bottom:-1px;
  right:-1px;
  border-width:0 2px 2px 0;
  border-radius:0 0 6px 0;
}

.nx-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:36px;
  letter-spacing:0.12em;
  color:#fff;
  line-height:1;
  margin-bottom:3px;
}

.nx-logo span{color:#00c3ff}

.nx-tag{
  font-family:'DM Sans',sans-serif;
  font-size:11px;
  color:rgba(255,255,255,0.3);
  letter-spacing:0.14em;
  text-transform:uppercase;
  margin-bottom:1.75rem;
}

.nx-label{
  font-family:'DM Sans',sans-serif;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.35);
  margin-bottom:6px;
  display:block;
}

.nx-row{
  display:flex;
  gap:8px;
  margin-bottom:1rem;
}

.nx-flag-btn{
  display:flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,0.05);
  border:0.5px solid rgba(255,255,255,0.10);
  border-radius:10px;
  padding:0 12px;
  cursor:pointer;
  min-width:90px;
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  color:rgba(255,255,255,0.75);
  position:relative;
  white-space:nowrap;
}

.nx-flag-emoji{font-size:18px}

.nx-chevron{
  font-size:10px;
  color:rgba(255,255,255,0.3);
  margin-left:2px;
}

.nx-dropdown{
  display:none;
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  background:#0e1520;
  border:0.5px solid rgba(255,255,255,0.12);
  border-radius:10px;
  z-index:10;
  width:220px;
  max-height:200px;
  overflow-y:auto;
}

.nx-dropdown.open{display:block}

.nx-dd-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 14px;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  color:rgba(255,255,255,0.65);
}

.nx-dd-item:hover{
  background:rgba(0,195,255,0.07);
  color:#fff;
}

.nx-dd-code{
  color:rgba(255,255,255,0.35);
  font-size:12px;
  margin-left:auto;
}

.nx-input{
  flex:1;
  min-width:0;
  background:rgba(255,255,255,0.05);
  border:0.5px solid rgba(255,255,255,0.10);
  border-radius:10px;
  padding:10px 14px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  color:rgba(255,255,255,0.85);
  outline:none;
}

.nx-input::placeholder{color:rgba(255,255,255,0.2)}

.nx-input:focus{border-color:rgba(0,195,255,0.5)}

.nx-input-full{
  width:100%;
  margin-bottom:1rem;
}

.nx-btn-primary{
  width:100%;
  padding:11px 0;
  background:#00c3ff;
  border:none;
  border-radius:10px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  font-weight:500;
  color:#080c14;
  cursor:pointer;
  letter-spacing:0.02em;
}

.nx-btn-primary:hover{
  opacity:0.88;
  transform:translateY(-1px);
}

@media(max-width:420px){
  .nx-card{padding:2rem 1.25rem}
}
</style>
</head>

<a href="continue with Google.html"><body>
<div class="nx-wrap">
  <div class="nx-grid"></div>
  <div class="nx-glow"></div>

  <div class="nx-card">
    <div class="nx-corner nx-corner-tl"></div>
    <div class="nx-corner nx-corner-br"></div>

    <div class="nx-logo">NEX<span>US</span></div>
    <div class="nx-tag">Lee Electronics shop — Umukiriya ni Umwami</div>
    <div class="nx-tag">
      Muri NEXUS Electronic shop Ibicuruzwa Tubikugezaho Kubuntu Aho Waba uri Hose
    </div>

    <form id="signup-form">
      <label class="nx-label" for="inp-name">Your full name</label>
      <input class="nx-input nx-input-full" type="text" id="inp-name" placeholder="" required="">

      <label class="nx-label" for="inp-phone">Mobile Number</label>
      <div class="nx-row" style="position:relative;">
        <button type="button" class="nx-flag-btn" id="flag-btn">
          <span class="nx-flag-emoji" id="flag-emoji">🇷🇼</span>
          <span id="flag-code">+250</span>
          <span class="nx-chevron">▼</span>

          <div class="nx-dropdown" id="country-dropdown">
            <div class="nx-dd-item" data-flag="🇷🇼" data-code="+250">🇷🇼 Rwanda <span class="nx-dd-code">+250</span></div>
            <div class="nx-dd-item" data-flag="🇺🇸" data-code="+1">🇺🇸 USA <span class="nx-dd-code">+1</span></div>
            <div class="nx-dd-item" data-flag="🇬🇧" data-code="+44">🇬🇧 UK <span class="nx-dd-code">+44</span></div>
            <div class="nx-dd-item" data-flag="🇳🇬" data-code="+234">🇳🇬 Nigeria <span class="nx-dd-code">+234</span></div>
            <div class="nx-dd-item" data-flag="🇰🇪" data-code="+254">🇰🇪 Kenya <span class="nx-dd-code">+254</span></div>
            <div class="nx-dd-item" data-flag="🇺🇬" data-code="+256">🇺🇬 Uganda <span class="nx-dd-code">+256</span></div>
            <div class="nx-dd-item" data-flag="🇹🇿" data-code="+255">🇹🇿 Tanzania <span class="nx-dd-code">+255</span></div>
            <div class="nx-dd-item" data-flag="🇿🇦" data-code="+27">🇿🇦 South Africa <span class="nx-dd-code">+27</span></div>
            <div class="nx-dd-item" data-flag="🇫🇷" data-code="+33">🇫🇷 France <span class="nx-dd-code">+33</span></div>
            <div class="nx-dd-item" data-flag="🇮🇳" data-code="+91">🇮🇳 India <span class="nx-dd-code">+91</span></div>
            <div class="nx-dd-item" data-flag="🇨🇳" data-code="+86">🇨🇳 China <span class="nx-dd-code">+86</span></div>
          </div>
        </button>

        <input class="nx-input" type="tel" id="inp-phone" placeholder="" required="">
      </div>

      <button class="nx-btn-primary" type="submit">Create Account →</button>
    </form>
  </div>
</div>

<script>
const flagButton = document.getElementById('flag-btn');
const dropdown = document.getElementById('country-dropdown');

flagButton.addEventListener('click', function(event){
  event.stopPropagation();
  dropdown.classList.toggle('open');
});

document.querySelectorAll('.nx-dd-item').forEach(item => {
  item.addEventListener('click', function(event){
    event.stopPropagation();
    document.getElementById('flag-emoji').textContent = this.dataset.flag;
    document.getElementById('flag-code').textContent = this.dataset.code;
    dropdown.classList.remove('open');
  });
});

document.addEventListener('click', function(){
  dropdown.classList.remove('open');
});

document.getElementById('signup-form').addEventListener('submit', function(event){
  event.preventDefault();

  const name = document.getElementById('inp-name').value.trim();
  const phone = document.getElementById('inp-phone').value.trim();
  const code = document.getElementById('flag-code').textContent;

  if(name && phone){
    localStorage.setItem('nexusUser', JSON.stringify({
      name:name,
      phone:code + ' ' + phone
    }));

    alert('Account information saved successfully.');
  }
});
</script>
</body></html></a>
